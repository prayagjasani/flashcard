<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8faf7" />
    <link rel="icon" href="/static/favicon.png" />
    <link rel="manifest" href="/static/manifest.json" />
    <title>Flashcards · Your library</title>
    <script type="module" crossorigin src="/static/react/assets/index-CiHqnO9S.js"></script>
    <link rel="stylesheet" crossorigin href="/static/react/assets/index-C-Mp1Fel.css">
  </head>
  <body class="ui-app ui-page-library">
    <div id="root"><p id="boot-status" role="status" style="padding:2rem;text-align:center;font-family:system-ui,sans-serif;color:#56605a">Opening your library…</p></div>
    <noscript>Please enable JavaScript to open your flashcard library.</noscript>
    <script>
      window.cleanAndReload = function () {
        var status = document.getElementById('boot-status');
        if (status) status.textContent = 'Updating app to latest version…';
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).finally(function () {
            if ('caches' in window) {
              caches.keys().then(function (names) {
                return Promise.all(names.map(function (n) { return caches.delete(n); }));
              }).finally(function () {
                window.location.href = '/?refresh=' + Date.now();
              });
            } else {
              window.location.href = '/?refresh=' + Date.now();
            }
          });
        } else {
          window.location.href = '/?refresh=' + Date.now();
        }
      };

      window.addEventListener('error', function (e) {
        if (e && e.target && e.target.tagName === 'SCRIPT') {
          console.warn('Script failed to load, triggering recovery');
          window.cleanAndReload();
        }
      }, true);

      window.setTimeout(function () {
        var status = document.getElementById('boot-status');
        if (status) {
          status.innerHTML = 'The app could not start.<br><button style="margin-top:14px;padding:10px 22px;border-radius:12px;background:#58b614;color:#fff;border:none;font-weight:600;font-size:1rem;cursor:pointer;" onclick="window.cleanAndReload()">Refresh App</button>';
        }
      }, 7000);
    </script>
  </body>
</html>
